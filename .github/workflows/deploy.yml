name: Deploy to Firebase Production on Main

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOALRECALL_BB4D0 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for Firebase Functions & CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Client Dependencies
        run: bun install

      - name: Build Frontend Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: goalrecall-bb4d0.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: goalrecall-bb4d0
          VITE_FIREBASE_STORAGE_BUCKET: goalrecall-bb4d0.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: bun run build

      - name: Install Functions Dependencies & Build Functions
        run: |
          cd functions
          npm ci || npm install
          npm run build

      - name: Authenticate with Google Cloud Service Account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOALRECALL_BB4D0 }}

      - name: Deploy Hosting to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOALRECALL_BB4D0 }}
          projectId: goalrecall-bb4d0
          channelId: live

      - name: Deploy Cloud Functions to Firebase
        run: |
          npx -y firebase-tools deploy --only functions --project goalrecall-bb4d0 --non-interactive